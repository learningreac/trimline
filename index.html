<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Trimline STEP Viewer</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="css/app.css">
<script async src="https://www.googletagmanager.com/gtag/js?id=G-QX9JEDQHC5"></script>
<script>window.dataLayer=window.dataLayer||[];function gtag(){dataLayer.push(arguments);}gtag('js',new Date());gtag('config','G-QX9JEDQHC5');</script>
</head>
<body>
<div class="app">
  <header class="titlebar">
    <div class="brand">
      <svg viewBox="0 0 32 32" width="26" height="26" aria-hidden="true"><path d="M4 26V8l12-4 12 4v18l-12 4Z" fill="none" stroke="currentColor" stroke-width="2"/><path d="M4 8l12 4 12-4M16 12v18" fill="none" stroke="currentColor" stroke-width="2"/><path d="M8.5 14.5c2 3 5 4.5 7.5 4.5" fill="none" stroke="var(--select)" stroke-width="2" stroke-linecap="round"/></svg>
      <div>
        <div class="product">Trimline</div>
        <div class="file"><span id="file-name">No file</span> <span id="schema" class="pill" hidden></span></div>
      </div>
    </div>
    <div class="tools">
      <button id="open-btn" class="btn primary" type="button">Open STEP / IGES…</button>
      <input id="file-input" type="file" accept=".stp,.step,.p21,.STEP,.STP,.igs,.iges,.IGS,.IGES" hidden>
      <label class="field"><span>Sample</span><select id="sample"><option value="">—</option></select></label>
      <label class="field"><span>Quality</span>
        <select id="quality">
          <option value="0.004">Draft · 0.4% chord</option>
          <option value="0.0015" selected>Normal · 0.15%</option>
          <option value="0.0005">Fine · 0.05%</option>
        </select>
      </label>
      <fieldset class="seg" aria-label="Color by">
        <legend>Color</legend>
        <label><input type="radio" name="colormode" value="file" checked><span>File</span></label>
        <label><input type="radio" name="colormode" value="part"><span>Part</span></label>
        <label><input type="radio" name="colormode" value="surface"><span>Surface</span></label>
        <label><input type="radio" name="colormode" value="status"><span>Trim state</span></label>
      </fieldset>
      <label class="toggle"><input id="edges" type="checkbox" checked><span>Edges</span></label>
    </div>
  </header>

  <main class="workspace">
    <nav class="activitybar left" aria-label="Side panels">
      <button class="act" type="button" data-panel="structure" aria-pressed="true" title="Structure — assembly tree and parts">
        <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M4 5h7M8 5v14M8 12h6M8 19h6" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/><rect x="14" y="9.5" width="6" height="5" rx="1" fill="none" stroke="currentColor" stroke-width="1.7"/><rect x="14" y="16.5" width="6" height="5" rx="1" fill="none" stroke="currentColor" stroke-width="1.7"/><circle cx="4" cy="5" r="1.6" fill="currentColor"/></svg>
        <span class="act-label">Structure</span>
      </button>
      <button class="act" type="button" data-panel="library" aria-pressed="false" title="Library — models kept from uploads">
        <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><ellipse cx="12" cy="6" rx="7.5" ry="2.8" fill="none" stroke="currentColor" stroke-width="1.7"/><path d="M4.5 6v6c0 1.5 3.4 2.8 7.5 2.8s7.5-1.3 7.5-2.8V6M4.5 12v6c0 1.5 3.4 2.8 7.5 2.8s7.5-1.3 7.5-2.8v-6" fill="none" stroke="currentColor" stroke-width="1.7"/></svg>
        <span class="act-label">Library</span>
        <b id="lib-count" class="act-badge mono" hidden></b>
      </button>
    </nav>

    <aside class="panel left" aria-label="Side panel">
      <div class="pane" data-pane="structure">
        <div class="tabs" role="tablist">
          <button role="tab" aria-selected="true" data-tab="tree">Assembly <b id="count-tree" class="mono"></b></button>
          <button role="tab" aria-selected="false" data-tab="parts">Parts <b id="count-parts" class="mono"></b></button>
        </div>
        <div id="tree" class="scroll tree"></div>
        <div id="parts" class="scroll parts" hidden></div>
      </div>
      <div class="pane" data-pane="library" hidden>
        <div id="library" class="scroll library"></div>
      </div>
    </aside>
    <div class="splitter" data-side="left" role="separator" aria-orientation="vertical" aria-label="Resize the side panel" tabindex="0" title="Drag to resize · double-click to reset"></div>

    <section class="viewport" aria-label="3D view">
      <canvas id="view"></canvas>
      <div id="tip" class="tip" hidden></div>
      <div id="legend" class="legend-float" hidden></div>
      <div class="viewbar">
        <button data-view="iso" type="button" title="Isometric">Iso</button>
        <button data-view="front" type="button">Front</button>
        <button data-view="top" type="button">Top</button>
        <button data-view="right" type="button">Right</button>
        <button id="fit" type="button" title="Fit all (F)">Fit</button>
        <span class="sep"></span>
        <fieldset class="seg mini" aria-label="Select">
          <legend>Select</legend>
          <label title="Pick faces"><input type="radio" name="pickmode" value="face" checked><span>Face</span></label>
          <label title="Pick model edges"><input type="radio" name="pickmode" value="edge"><span>Edge</span></label>
          <label title="Pick B-rep vertices"><input type="radio" name="pickmode" value="vertex"><span>Vertex</span></label>
          <label title="The nearest vertex, edge or face under the cursor"><input type="radio" name="pickmode" value="auto"><span>Auto</span></label>
        </fieldset>
        <span class="sep"></span>
        <label class="sec"><span>Up</span><select id="up-axis"><option value="z">Z</option><option value="y">Y</option></select></label>
        <label class="sec"><span>Navigate</span><select id="nav-mode" title="Arcball: free trackball rotation, cursor zoom, double-click to focus. Orbit: turntable around the up axis."><option value="arcball">Arcball</option><option value="orbit">Orbit</option></select></label>
        <span class="sep"></span>
        <label class="sec"><span>Section</span>
          <select id="section-axis"><option value="">off</option><option value="x">X</option><option value="y">Y</option><option value="z">Z</option></select>
          <input id="section-pos" type="range" min="0" max="1000" value="500" aria-label="Section position">
        </label>
      </div>
      <div id="drop-hint" class="drop-hint" hidden>Drop a .step / .stp / .iges / .igs file anywhere, or use <b>Open STEP / IGES…</b></div>
      <div class="drop-veil">Drop to open</div>
    </section>

    <div class="splitter" data-side="right" role="separator" aria-orientation="vertical" aria-label="Resize the inspector" tabindex="0" title="Drag to resize · double-click to reset"></div>
    <aside class="panel right" aria-label="Inspector">
      <div class="pane" data-pane="inspect">
        <div id="inspector" class="scroll inspector"></div>
      </div>
      <div class="pane" data-pane="data" hidden>
        <div id="brep-data" class="brepdata"></div>
      </div>
    </aside>
    <nav class="activitybar right" aria-label="Inspector panels">
      <button class="act" type="button" data-panel="inspect" aria-pressed="true" title="Inspect — file, selection and picked element">
        <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6" fill="none" stroke="currentColor" stroke-width="1.7"/><path d="M15 15l5 5" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/><path d="M10.5 8v5M8 10.5h5" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
        <span class="act-label">Inspect</span>
      </button>
      <button class="act" type="button" data-panel="data" aria-pressed="false" title="B-rep data — topology and geometry as JSON">
        <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M8 4c-2 0-2.5 1-2.5 3v2.5c0 1.2-.8 2-2 2.5 1.2.5 2 1.3 2 2.5V17c0 2 .5 3 2.5 3M16 4c2 0 2.5 1 2.5 3v2.5c0 1.2.8 2 2 2.5-1.2.5-2 1.3-2 2.5V17c0 2-.5 3-2.5 3" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/><circle cx="12" cy="12" r="1.3" fill="currentColor"/></svg>
        <span class="act-label">B-rep</span>
      </button>
    </nav>
  </main>

  <footer class="statusbar">
    <div id="progress" class="progress" hidden><i></i></div>
    <span id="status-text">Starting…</span>
    <span id="status-counts" class="mono"></span>
  </footer>
</div>
<script type="module" src="app/main.js"></script>
</body>
</html>
